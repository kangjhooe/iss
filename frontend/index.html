<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="%HTML_DESCRIPTION%">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="%HTML_APP_NAME%">
    <title>%HTML_TITLE%</title>
    <!-- Open Graph: preview link WhatsApp, Facebook, Telegram, dll. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="%HTML_OG_URL%">
    <meta property="og:title" content="%HTML_TITLE%">
    <meta property="og:description" content="%HTML_DESCRIPTION%">
    <meta property="og:image" content="%HTML_OG_IMAGE%">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:site_name" content="%HTML_APP_NAME%">
    <meta property="og:locale" content="id_ID">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="%HTML_TITLE%">
    <meta name="twitter:description" content="%HTML_DESCRIPTION%">
    <meta name="twitter:image" content="%HTML_OG_IMAGE%">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
